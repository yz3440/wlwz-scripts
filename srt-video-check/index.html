<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRT Video Check Tool</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f5;
      }
      h1 {
        color: #333;
        text-align: center;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .episode-selector {
        margin-bottom: 20px;
      }
      .main-content {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .video-panel {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        flex-direction: column;
        align-items: center;
      }
      .video-controls-toggle {
        margin-top: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 14px;
      }
      .video-controls-toggle:hover {
        background-color: #0056b3;
      }
      .video-controls-toggle .icon {
        transition: transform 0.3s ease;
        display: inline-block;
      }
      .video-controls-toggle.expanded .icon {
        transform: rotate(180deg);
      }
      .video-controls-container {
        width: 100%;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      .video-controls-container.expanded {
        max-height: 200px; /* Adjust as needed */
      }
      .video-controls {
        width: 100%;
        max-width: 600px;
        background-color: #fff;
        border-radius: 5px;
        padding: 15px;
        margin-top: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-left: auto;
        margin-right: auto;
      }
      .slider-container {
        margin-bottom: 10px;
      }
      .slider-container label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }
      .slider-container input {
        width: 100%;
      }
      .slider-value {
        display: inline-block;
        width: 40px;
        text-align: right;
        margin-left: 10px;
      }
      .editor-panel {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .video-container {
        position: relative;
        background-color: #000;
        display: inline-block;
      }
      #video-player {
        display: block;
      }
      .dimmed-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        pointer-events: none;
      }
      .subtitle-box {
        position: absolute;
        border: 2px solid red;
        background-color: transparent;
        pointer-events: none;
      }
      .srt-drop-area {
        border: 2px dashed #aaa;
        border-radius: 5px;
        padding: 20px;
        text-align: center;
        margin-bottom: 20px;
        background-color: #fff;
        transition: all 0.3s ease;
      }
      .srt-drop-area.dragover {
        border-color: #007bff;
        background-color: #e6f7ff;
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
      }
      .srt-editor {
        display: flex;
        flex-direction: row;
        gap: 10px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 10px;
        max-height: 300px;
        align-items: flex-start;
        width: 100%;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: #007bff #e6f2ff;
      }
      .srt-editor::-webkit-scrollbar {
        height: 8px;
      }
      .srt-editor::-webkit-scrollbar-track {
        background: #e6f2ff;
        border-radius: 4px;
      }
      .srt-editor::-webkit-scrollbar-thumb {
        background-color: #007bff;
        border-radius: 4px;
      }
      .srt-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .srt-entry {
        padding: 10px;
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        flex: 0 0 auto;
        width: 250px;
        max-width: 250px;
        box-sizing: border-box;
        transition: all 0.2s ease;
      }
      .srt-entry.active {
        border-color: #007bff;
        background-color: #e6f2ff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        transform: translateY(-2px);
      }
      .entry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .srt-header {
        font-weight: bold;
        color: #555;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .delete-btn {
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 16px;
        line-height: 1;
        padding: 0;
        margin-left: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .delete-btn:hover {
        background-color: #c0392b;
        transform: scale(1.1);
      }
      .srt-text {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        resize: vertical;
        box-sizing: border-box;
      }
      button {
        padding: 8px 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      .hidden {
        display: none;
      }
      input[type='file'] {
        margin-top: 10px;
      }
      select {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #ddd;
        min-width: 200px;
      }
      @media (max-width: 768px) {
        .srt-controls {
          flex-direction: column;
        }
        button {
          width: 100%;
        }
        .delete-btn {
          width: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>SRT Video Check Tool</h1>

      <div class="episode-selector">
        <label for="episode-select">Select Episode:</label>
        <select id="episode-select">
          <option value="">-- Select an episode --</option>
          <!-- Episodes will be loaded here -->
        </select>
      </div>

      <div class="main-content">
        <div class="video-panel">
          <div class="video-container hidden" id="video-wrapper">
            <video id="video-player" controls>
              Your browser does not support the video element.
            </video>
            <div class="dimmed-overlay" id="dimmed-overlay"></div>
            <div class="subtitle-box" id="subtitle-box"></div>
          </div>

          <button
            id="video-controls-toggle"
            class="video-controls-toggle hidden"
          >
            Video Adjustments <span class="icon">▼</span>
          </button>

          <div id="video-controls-container" class="video-controls-container">
            <div class="video-controls" id="video-controls">
              <div class="slider-container">
                <label for="brightness-slider">
                  Brightness:
                  <span id="brightness-value" class="slider-value">100%</span>
                </label>
                <input
                  type="range"
                  id="brightness-slider"
                  min="50"
                  max="200"
                  value="100"
                  step="5"
                />
              </div>

              <div class="slider-container">
                <label for="contrast-slider">
                  Contrast:
                  <span id="contrast-value" class="slider-value">100%</span>
                </label>
                <input
                  type="range"
                  id="contrast-slider"
                  min="50"
                  max="200"
                  value="100"
                  step="5"
                />
              </div>

              <div class="slider-container">
                <button id="reset-video-filters">Reset to Default</button>
              </div>
            </div>
          </div>
        </div>

        <div class="editor-panel">
          <div class="srt-controls hidden" id="srt-controls">
            <button id="prev-subtitle">Previous Subtitle (↑)</button>
            <button id="next-subtitle">Next Subtitle (↓)</button>
            <button id="save-srt">Save SRT</button>
          </div>

          <div class="srt-editor hidden" id="srt-editor">
            <!-- SRT entries will be loaded here -->
          </div>

          <div class="srt-drop-area" id="srt-drop-area">
            <p>Drag & Drop SRT file here or</p>
            <input type="file" id="srt-file-input" accept=".srt" />
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
